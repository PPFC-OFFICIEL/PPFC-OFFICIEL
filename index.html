<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b40819"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>PPFC OFFICIEL</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#202024;font:16px system-ui}header{background:#b40819;color:white;text-align:center;padding:24px 12px;border-bottom:6px solid #ffdc00}header img{width:100px;border-radius:16px}h1{margin:8px 0;color:#ffdc00}main{max-width:760px;margin:auto;padding:18px}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:white}button{cursor:pointer;border:0;border-radius:10px;padding:12px;font:inherit;background:#eee;color:#222}button.active,button.primary{background:#b40819;color:white}article,form{background:white;border-radius:14px;padding:18px;margin:12px 0;border-left:4px solid #edc400;white-space:pre-wrap;overflow-wrap:anywhere}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;font:inherit}footer{text-align:center;padding:24px}small{color:#666}article img{max-width:100%;border-radius:8px}</style><header><img src="logo.jpg" alt="Logo PPFC"><h1>PPFC OFFICIEL</h1>Puy-l’Évêque / Prayssac Football Club · 1990</header><nav id="nav"></nav><main><h2 id="heading"></h2><div id="status"></div><div id="items"></div><section id="admin" hidden><form id="login"><h3>Connexion administrateur</h3><input id="email" type="email" placeholder="Adresse e-mail" required><input id="password" type="password" placeholder="Mot de passe" required><button class="primary">Connexion</button></form><form id="editor" hidden><h3>Publier ou modifier</h3><select id="category"></select><input id="title" placeholder="Titre" required><textarea id="body" placeholder="Informations" rows="5" required></textarea><input id="photo" type="url" placeholder="Lien HTTPS d’une photo (facultatif)"><button class="primary">Enregistrer</button> <button type="button" id="reset">Nouvelle publication</button> <button type="button" id="logout">Déconnexion</button></form></section></main><footer><button id="adminButton">Administration</button><p>🔴 🟡 PPFC OFFICIEL</p></footer><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='REMPLACER_URL_SUPABASE', KEY='REMPLACER_CLE_PUBLIQUE';const db=URL.startsWith('https://')?createClient(URL,KEY):null;
const cats=['Actualités','Matchs','Résultats','Classements','Buteurs','Équipes','Photos','Boutique','Sponsors','Stades','Contacts'];const $=id=>document.getElementById(id);let current=cats[0],session=null,editing=null;
for(const c of cats){let b=document.createElement('button');b.textContent=c;b.onclick=()=>{current=c;render()};$('nav').append(b);let o=document.createElement('option');o.textContent=c;$('category').append(o)}
function msg(t){$('status').textContent=t}function clear(){editing=null;$('editor').reset()}
async function render(){ $('heading').textContent=current;[...$('nav').children].forEach(b=>b.classList.toggle('active',b.textContent===current));$('items').replaceChildren();if(!db){msg('Version de démonstration : connexion à la base de données à configurer.');return}const {data,error}=await db.from('publications').select('*').eq('category',current).order('created_at',{ascending:false});if(error){msg(error.message);return}msg(data.length?'':'Aucune publication pour le moment.');for(const p of data){let a=document.createElement('article'),h=document.createElement('h3'),t=document.createElement('p');h.textContent=p.title;t.textContent=p.body;a.append(h,t);if(p.photo?.startsWith('https://')){let im=document.createElement('img');im.src=p.photo;im.alt=p.title;a.append(im)}if(session){let b=document.createElement('button');b.textContent='Modifier';b.onclick=()=>{editing=p.id;$('category').value=p.category;$('title').value=p.title;$('body').value=p.body;$('photo').value=p.photo||'';$('admin').hidden=false;$('editor').scrollIntoView()};let d=document.createElement('button');d.textContent='Supprimer';d.onclick=async()=>{if(confirm('Supprimer cette publication ?')){let {error}=await db.from('publications').delete().eq('id',p.id);if(error)alert(error.message);else render()}};a.append(b,d)}$('items').append(a)}}
$('adminButton').onclick=()=>{$('admin').hidden=!$('admin').hidden;if(!db)msg('Administration indisponible avant configuration.');};$('login').onsubmit=async e=>{e.preventDefault();if(!db)return alert('Configurer Supabase avant la connexion.');let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)alert(error.message);};$('editor').onsubmit=async e=>{e.preventDefault();let p={category:$('category').value,title:$('title').value,body:$('body').value,photo:$('photo').value};let {error}=editing?await db.from('publications').update(p).eq('id',editing):await db.from('publications').insert(p);if(error)alert(error.message);else{current=p.category;clear();render()}};$('reset').onclick=clear;$('logout').onclick=()=>db.auth.signOut();if(db)db.auth.onAuthStateChange((_e,s)=>{session=s;$('login').hidden=!!s;$('editor').hidden=!s;setTimeout(render,0)});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
